# Three services on one internal network.
#
# This host already runs nginx on 80/443, so the caddy service is removed and
# nginx terminates TLS instead (see README). pager and ntfy publish on the
# loopback interface only, so nothing is reachable from outside except through
# nginx. Redis stays entirely on the internal network.
#
# The Caddyfile is kept in the repo for clean-box deploys.
#
# Copy .env.example to .env and fill it in before the first `docker compose up`.

services:
  pager:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      ntfy:
        condition: service_started
    environment:
      REDIS_ADDR: redis:6379
      # ntfy is reached over the internal network, not through Caddy: paging
      # must not depend on TLS termination or on public DNS resolving.
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env}
      NTFY_TOKEN: ${NTFY_TOKEN:?set NTFY_TOKEN in .env}
      # Must be the public HTTPS URL: this is what the ack link in your pocket
      # resolves to.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      LISTEN_ADDR: ":8080"
      POLL_INTERVAL: ${POLL_INTERVAL:-60s}
      ESCALATION_INTERVAL: ${ESCALATION_INTERVAL:-5m}
      FAILURE_THRESHOLD: ${FAILURE_THRESHOLD:-3}
      RECOVERY_THRESHOLD: ${RECOVERY_THRESHOLD:-2}
      CHECKS_FILE: /app/checks.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Loopback only: nginx proxies to this, nothing else can reach it.
      - "127.0.0.1:8080:8080"
    volumes:
      # Mounted read-only so `docker compose restart pager` picks up edits
      # without a rebuild.
      - ./checks.yaml:/app/checks.yaml:ro
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps incidents across a Redis restart. Without it a restart
    # mid-outage would drop the incident and re-page from level 1.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:?set NTFY_PUBLIC_URL in .env}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: "12h"
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      # deny-all is what makes the topic private: without it, anyone who knows
      # the topic name can read your alerts and publish fake ones.
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
    ports:
      # Loopback only: nginx proxies to this, nothing else can reach it.
      - "127.0.0.1:8081:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-data:/var/lib/ntfy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  redis-data:
  ntfy-cache:
  ntfy-data:
