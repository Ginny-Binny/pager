# Four services on one internal network. Only Caddy publishes ports, so Redis,
# ntfy and the monitor are unreachable from outside the host.
#
# Copy .env.example to .env and fill it in before the first `docker compose up`.

services:
  pager:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      ntfy:
        condition: service_started
    environment:
      REDIS_ADDR: redis:6379
      # ntfy is reached over the internal network, not through Caddy: paging
      # must not depend on TLS termination or on public DNS resolving.
      NTFY_URL: http://ntfy:80
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env}
      NTFY_TOKEN: ${NTFY_TOKEN:?set NTFY_TOKEN in .env}
      # Must be the public HTTPS URL: this is what the ack link in your pocket
      # resolves to.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      LISTEN_ADDR: ":8080"
      POLL_INTERVAL: ${POLL_INTERVAL:-60s}
      ESCALATION_INTERVAL: ${ESCALATION_INTERVAL:-5m}
      FAILURE_THRESHOLD: ${FAILURE_THRESHOLD:-3}
      RECOVERY_THRESHOLD: ${RECOVERY_THRESHOLD:-2}
      CHECKS_FILE: /app/checks.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Mounted read-only so `docker compose restart pager` picks up edits
      # without a rebuild.
      - ./checks.yaml:/app/checks.yaml:ro
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps incidents across a Redis restart. Without it a restart
    # mid-outage would drop the incident and re-page from level 1.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:?set NTFY_PUBLIC_URL in .env}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: "12h"
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      # deny-all is what makes the topic private: without it, anyone who knows
      # the topic name can read your alerts and publish fake ones.
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-data:/var/lib/ntfy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [pager, ntfy]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NTFY_DOMAIN: ${NTFY_DOMAIN:?set NTFY_DOMAIN in .env}
      PAGER_DOMAIN: ${PAGER_DOMAIN:?set PAGER_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      STATUS_BASIC_AUTH: ${STATUS_BASIC_AUTH:?set STATUS_BASIC_AUTH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  redis-data:
  ntfy-cache:
  ntfy-data:
  caddy-data:
  caddy-config:
